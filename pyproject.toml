[project]
name = "mindshift-arena"
version = "0.1.0"
description = "A CLI-only multi-agent debate system where agents can change their minds."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "MindShift Arena" }]
dependencies = [
  "langgraph>=0.2.70",
  "openai>=1.60.0",
  "pydantic>=2.9.0",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "sqlmodel>=0.0.22",
  "typer>=0.15.0",
]

[project.scripts]
mindshift = "mindshift.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mindshift"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
